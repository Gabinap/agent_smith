[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.18,<3.11"
dependencies = [
    "docker>=7.2.0",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pyfiglet>=1.0.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "srcs"]
